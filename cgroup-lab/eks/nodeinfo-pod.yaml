#
# One pod per node group that prints what the node offers to containers: kernel, cgroup file
# system type, transparent huge page settings, page size, CPU count and features, and the
# pod's own cgroup. Run-to-completion pods: no liveness or readiness probes. run-eks-matrix.sh
# applies a copy with the instance family in the pod names (nodeinfo-<os>-<family>) and a
# node.kubernetes.io/instance-type selector next to lab/os.
apiVersion: v1
kind: Pod
metadata:
  name: nodeinfo-al2023
  namespace: jvm-cgroup-lab
  labels:
    app.kubernetes.io/name: jvm-cgroup-lab
    lab/role: nodeinfo
  annotations:
    checkov.io/skip1: CKV_K8S_8=Run-to-completion pod; a liveness probe does not apply
    checkov.io/skip2: CKV_K8S_9=Run-to-completion pod; a readiness probe does not apply
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    lab/os: al2023
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nodeinfo
      image: public.ecr.aws/amazonlinux/amazonlinux:2023@sha256:381352c430f36d8aa6b8b670de06e7e4e5642fe0cb9dbd463bb8d1e79aefc0c7
      imagePullPolicy: Always
      command: ["/bin/bash", "-c"]
      args:
        - |
          echo "kernel: $(uname -r)"
          echo "cgroup_fs: $(stat -fc %T /sys/fs/cgroup)"
          echo "thp_enabled: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
          echo "thp_defrag: $(cat /sys/kernel/mm/transparent_hugepage/defrag)"
          echo "page_size: $(getconf PAGESIZE)"
          echo "nproc: $(nproc)"
          grep -m 1 '^Features' /proc/cpuinfo
          echo "cgroup_controllers: $(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null)"
          echo "proc_self_cgroup:"; cat /proc/self/cgroup
          echo "cgroup_mounts:"; grep cgroup /proc/self/mountinfo
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
---
